<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Future-dated candidate scoring</title>
    <!-- meta candidate: base score 7, penalized to 5 while it lies in
         the future relative to "now". -->
    <meta property="article:published_time" content="2024-03-29">
</head>
<body>
    <article>
        <h1>Future-dated candidate scoring</h1>
        <!-- itemprop tag candidate (not a meta tag): fixed score 6.
             It wins while the meta candidate is future-penalized and
             loses once the meta date is in the past. -->
        <span itemprop="datePublished" datetime="2024-03-18">March 18</span>
        <p>Body text of the article used to exercise publication date
        extraction when a candidate is dated in the future.</p>
    </article>
</body>
</html>
