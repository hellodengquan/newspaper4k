<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Naive date and cross-day time</title>
    <!-- meta candidate: naive date without timezone, score 7 -->
    <meta property="article:published_time" content="2024-03-15">
    <!-- JSON-LD dateCreated: score 7 -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "headline": "Naive date and cross-day time",
        "dateCreated": "2024-03-14"
    }
    </script>
</head>
<body>
    <article>
        <h1>Naive date and cross-day time</h1>
        <!-- time tag with boost word: score 8. Aware time whose UTC date
             (2024-03-16) crosses the day boundary relative to the naive
             meta date (2024-03-15). -->
        <time datetime="2024-03-16T04:30:00+00:00">Published on March 16</time>
        <p>Body text of the article used to exercise publication date
        extraction when a timezone-less date competes with a cross-day
        timezone-aware time.</p>
    </article>
</body>
</html>
